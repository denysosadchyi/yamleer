template: single-column

blocks:
  - block: hero-text
    title: Start the week with one source of truth
    lead: >-
      Harbor connects the fleet data you already have — telemetry, paperwork,
      crew, ports, certificates — into one workspace. No migration drama, no
      rip-and-replace, no consultancy quoted in months that you didn't budget
      for.
    cta:
      primitive: action
      label: Start a free pilot
      intent: primary
    tone: neutral
    density: comfortable

  - block: section
    heading: How it works
    description: >-
      Connect the systems your team already lives in. Harbor reads the data
      alongside what you have today; your team keeps working the same way —
      no rebooting, no retraining, no replacing tools that already work.
    tone: neutral
    slots:
      body:
        - block: card
          heading: Connect your data
          body: >-
            Point Harbor at the AIS feeds, fleet management system, and ports
            of call you already use. Read-only on day one — no schema
            changes, no production writes, no risk to your existing tooling.
          icon: { primitive: icon, name: link, size: sm }
          cta: { primitive: action, label: See integrations, intent: secondary }
          tone: neutral
        - block: card
          heading: Watch patterns emerge
          body: >-
            Within a week, Harbor surfaces the patterns hidden across your
            data: late departures, fuel drift, contract gaps, certificate
            cliffs — without anyone on your team running a single report.
          icon: { primitive: icon, name: chart, size: md }
          cta: { primitive: action, label: See sample insights, intent: secondary }
          tone: emphasis
        - block: card
          heading: Act on what you see
          body: >-
            Decide where to invest attention. Reroute, refuel, recertify,
            redeploy crew — Harbor tracks every action and tells you, two
            weeks later, whether it actually worked.
          icon: { primitive: icon, name: compass }
          cta: { primitive: action, label: Workflows, intent: ghost }
          tone: muted

  - block: section
    heading: Why teams choose Harbor
    description: >-
      The shore-side teams we work with came to us through the same three
      operational problems — spreadsheet fatigue, audit anxiety, and a
      visibility gap that grew with the fleet.
    tone: emphasis
    slots:
      body:
        - block: card
          heading: Less time in spreadsheets
          body: >-
            Our customers report a 40 percent drop in time spent reconciling
            daily fleet reports within the first quarter of using Harbor
            across their operations team.
          icon: { primitive: icon, name: clock, size: md }
          cta: { primitive: action, label: Read the case study, intent: secondary }
          tone: muted
        - block: card
          heading: Fewer surprises in audits
          body: >-
            Compliance records and operational data live in the same place,
            indexed against the vessels and crew they belong to. No more
            cross-referencing the day before an inspection.
          icon: { primitive: icon, name: handshake, size: lg }
          cta: { primitive: action, label: Compliance brief, intent: ghost }
          tone: emphasis

  - block: cta-bar
    heading: See Harbor on your data, not ours
    body: >-
      Pilot programs run for four weeks, on your own data, with no
      commitment beyond what we agree at the kickoff conversation.
    cta:
      primitive: action
      label: Start a pilot
      intent: primary
    tone: emphasis
