family:
  sans: "system-ui, -apple-system, 'Segoe UI', sans-serif"
  serif: "Georgia, 'Times New Roman', serif"
  mono: "ui-monospace, 'SF Mono', Menlo, monospace"

fluid-range:
  from: 320
  to: 1200

style:
  # Tightened product-grade scale per impeccable product register:
  # ~1.15 ratio between adjacent steps; near-fixed at desktop viewports.
  # Display is marketing-only and keeps a wider range.
  caption:
    size: { min: 12, ideal: 13, max: 13 }
    weight: 400
    line-height: 1.45
  body:
    size: { min: 14, ideal: 15, max: 15 }
    weight: 400
    line-height: 1.55
  heading-sm:
    size: { min: 15, ideal: 17, max: 17 }
    weight: 600
    line-height: 1.35
  heading-md:
    size: { min: 18, ideal: 20, max: 20 }
    weight: 600
    line-height: 1.3
  heading-lg:
    size: { min: 21, ideal: 24, max: 24 }
    weight: 600
    line-height: 1.2
  display:
    size: { min: 32, ideal: 48, max: 64 }
    weight: 700
    line-height: 1.05
    letter-spacing: -0.02
