family:
  sans: "system-ui, -apple-system, 'Segoe UI', sans-serif"
  serif: "Georgia, 'Times New Roman', serif"
  mono: "ui-monospace, 'SF Mono', Menlo, monospace"

fluid-range:
  from: 320
  to: 1200

style:
  caption:
    size: { min: 12, ideal: 13, max: 14 }
    weight: 400
    line-height: 1.45
  body:
    size: { min: 15, ideal: 16, max: 17 }
    weight: 400
    line-height: 1.55
  heading-sm:
    size: { min: 18, ideal: 20, max: 22 }
    weight: 600
    line-height: 1.35
  heading-md:
    size: { min: 22, ideal: 26, max: 30 }
    weight: 600
    line-height: 1.25
  heading-lg:
    size: { min: 28, ideal: 36, max: 42 }
    weight: 700
    line-height: 1.15
  display:
    size: { min: 38, ideal: 56, max: 72 }
    weight: 700
    line-height: 1.05
    letter-spacing: -0.02
