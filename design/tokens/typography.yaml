family:
  sans: "system-ui, -apple-system, 'Segoe UI', sans-serif"
  serif: "Georgia, 'Times New Roman', serif"
  mono: "ui-monospace, 'SF Mono', Menlo, monospace"

size:
  caption: "clamp(0.78rem, 0.74rem + 0.2vw, 0.88rem)"
  body: "clamp(0.95rem, 0.9rem + 0.3vw, 1.05rem)"
  heading-sm: "clamp(1.1rem, 1rem + 0.5vw, 1.3rem)"
  heading-md: "clamp(1.4rem, 1.2rem + 1vw, 1.8rem)"
  heading-lg: "clamp(1.8rem, 1.5rem + 1.5vw, 2.5rem)"
  display: "clamp(2.4rem, 1.9rem + 2.8vw, 4rem)"

weight:
  regular: 400
  medium: 500
  semibold: 600
  bold: 700

line-height:
  tight: 1.15
  normal: 1.5
  relaxed: 1.7
