# Tone roles — two semantic groups:
# - neutral, emphasis, muted  → brand expression (marketing content, primary UI surfaces)
# - danger, success           → behavioral states (alarms, outcomes); used by
#                               screen-state variants in v0.2 (error/success/empty/loading).
# MVP screens currently exercise only the brand group.
tone:
  neutral:
    surface: { token: surface-neutral }
    text: { token: text-primary }
    border: { token: border-subtle }
  emphasis:
    surface: { token: surface-emphasis }
    text: { token: text-inverse }
    border: { token: border-emphasis }
  muted:
    surface: { token: surface-muted }
    text: { token: text-secondary }
    border: { token: border-subtle }
  danger:
    surface: { token: surface-danger }
    text: { token: text-danger }
    border: { token: border-danger }
  success:
    surface: { token: surface-success }
    text: { token: text-success }
    border: { token: border-success }

color-role:
  primary: { token: brand-primary }
  secondary: { token: brand-secondary }
  accent: { token: brand-accent }
