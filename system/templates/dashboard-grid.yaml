type: dashboard-grid
description: Slotted multi-zone layout — optional sidebar, header, main, optional footer

mode: slotted
slots:
  sidebar:
    allows: [sidebar-nav]
    cardinality: one
    required: false
  header:
    allows: [hero-text, page-header]
    cardinality: one
    required: true
  main:
    allows: [section]
    cardinality: many
    required: true
    min: 1
  footer:
    allows: [cta-bar]
    cardinality: one
    required: false
