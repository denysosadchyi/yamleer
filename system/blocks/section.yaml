type: section
description: Titled content section — heading + body slot for atomic blocks
role: structural

fields:
  heading:
    type: string
    required: true
    max-length: 40
  description:
    type: string
    max-length: 240
  empty-state:
    type: string
    required: false
    max-length: 120

slots:
  body:
    allows: [setting-row, task-item]
    cardinality: many
    required: true
    min: 0

variants:
  tone: { tokenRef: tone }
  density: { enum: [comfortable, compact] }
