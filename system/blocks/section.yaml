type: section
description: Titled content section — heading + body slot for atomic blocks
role: structural

fields:
  heading:
    type: string
    required: true
    max-length: 40
  description:
    type: string
    max-length: 240

slots:
  body:
    allows: [card, setting-row, task-item]
    cardinality: many
    required: true
    min: 1

variants:
  tone: { tokenRef: tone }
  density: { enum: [comfortable, compact] }
