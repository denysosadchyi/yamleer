type: card
description: Atomic content card — icon, heading, body, optional action

fields:
  heading:
    type: string
    required: true
    max-length: 60
  body:
    type: string
    max-length: 200
  icon:
    type: ref
    ref-kind: primitive
    ref-type: icon
  cta:
    type: ref
    ref-kind: primitive
    ref-type: action

variants:
  tone: { tokenRef: tone }
