$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "yamleer://tokens.schema.yaml"

$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"

  scalar-value:
    type: string
    minLength: 1

  flat-string-scale:
    type: object
    propertyNames:
      $ref: "#/$defs/identifier"
    additionalProperties:
      $ref: "#/$defs/scalar-value"

  token-ref:
    type: object
    properties:
      token:
        $ref: "#/$defs/identifier"
    required: [token]
    additionalProperties: false

  colors:
    $ref: "#/$defs/flat-string-scale"

  spacing:
    $ref: "#/$defs/flat-string-scale"

  radius:
    $ref: "#/$defs/flat-string-scale"

  font-size:
    type: object
    properties:
      min: { type: number, minimum: 1 }
      ideal: { type: number, minimum: 1 }
      max: { type: number, minimum: 1 }
    required: [min, ideal, max]
    additionalProperties: false

  type-style:
    type: object
    properties:
      size: { $ref: "#/$defs/font-size" }
      weight: { type: integer, minimum: 100, maximum: 1000 }
      line-height: { type: number, minimum: 0.5, maximum: 3 }
      letter-spacing: { type: number }
    required: [size, weight, line-height]
    additionalProperties: false

  fluid-range:
    type: object
    properties:
      from: { type: number, minimum: 1 }
      to: { type: number, minimum: 1 }
    required: [from, to]
    additionalProperties: false

  typography:
    type: object
    properties:
      family:
        $ref: "#/$defs/flat-string-scale"
      fluid-range:
        $ref: "#/$defs/fluid-range"
      style:
        type: object
        propertyNames:
          $ref: "#/$defs/identifier"
        additionalProperties:
          $ref: "#/$defs/type-style"
    required: [family, fluid-range, style]
    additionalProperties: false

  tone-entry:
    type: object
    properties:
      surface: { $ref: "#/$defs/token-ref" }
      text: { $ref: "#/$defs/token-ref" }
      border: { $ref: "#/$defs/token-ref" }
    required: [surface, text, border]
    additionalProperties: false

  roles:
    type: object
    properties:
      tone:
        type: object
        propertyNames:
          $ref: "#/$defs/identifier"
        additionalProperties:
          $ref: "#/$defs/tone-entry"
      color-role:
        type: object
        propertyNames:
          $ref: "#/$defs/identifier"
        additionalProperties:
          $ref: "#/$defs/token-ref"
    required: [tone, color-role]
    additionalProperties: false
